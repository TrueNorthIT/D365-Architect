# Ollama on the bigmac host, reached from the Colima container.
providers:
  bigmac:
    baseUrl: http://host.docker.internal:11434/v1
    api: openai-completions
    auth: none
    models:
      - id: flint:latest
        name: Recursive Flint 40B A2.5B 4-bit QAT (Bigmac)
        contextWindow: 262144
        maxTokens: 8192
      - id: qwen3.8:27b
        name: Qwen3.8 27B Q8 (Bigmac)
        contextWindow: 262144
        maxTokens: 16384
