name: Issue agent

# Label an issue `agent` (as an allow-listed user) and a local model on bigmac works on it,
# then opens a PR or posts its findings. The agent itself lives in the private
# TrueNorthIT/tn-local-agents kit, pinned below; this file only triggers and gates it.
on:
  issues:
    types: [labeled]

concurrency:
  group: issue-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  KIT_REF: v1.0.0            # bump by PR after testing with the kit's bench
  KIT_PROFILE: D365-Architect

jobs:
  agent:
    # Both the issue author and whoever added the label must be on the list.
    # Checked before anything from the kit is fetched.
    if: >-
      github.event.label.name == 'agent' &&
      contains(fromJSON('["BPMichon", "JCottrell-TrueNorthIT"]'), github.event.sender.login) &&
      contains(fromJSON('["BPMichon", "JCottrell-TrueNorthIT"]'), github.event.issue.user.login)
    runs-on: [self-hosted, bigmac]
    timeout-minutes: 180
    env:
      GH_REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      # Read-only access to the private kit, cloned outside the workspace.
      - id: kit-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.BIGMAC_APP_ID }}
          private-key: ${{ secrets.BIGMAC_APP_PRIVATE_KEY }}
          repositories: tn-local-agents

      - name: Fetch kit
        env:
          TOKEN: ${{ steps.kit-token.outputs.token }}
        run: |
          rm -rf "$RUNNER_TEMP/kit"
          git -c credential.helper= \
            -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64)" \
            clone -q --depth 1 --branch "$KIT_REF" https://github.com/TrueNorthIT/tn-local-agents.git "$RUNNER_TEMP/kit"
          echo "KIT_DIR=$RUNNER_TEMP/kit" >> "$GITHUB_ENV"

      - name: Claim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$KIT_DIR/adapters/github/run-agent.sh" claim'

      - name: Run agent
        run: '"$KIT_DIR/adapters/github/run-agent.sh" run'

      # Write access to this repo, minted only after the agent has finished.
      - id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.BIGMAC_APP_ID }}
          private-key: ${{ secrets.BIGMAC_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: '"$KIT_DIR/adapters/github/run-agent.sh" publish'

      - name: Report failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "$N" --remove-label agent-in-progress || true
          gh issue comment "$N" --body "Agent run failed: $RUN_URL"

      - name: Clean up
        if: always()
        run: |
          [ -x "${KIT_DIR:-/nonexistent}/adapters/github/run-agent.sh" ] && "$KIT_DIR/adapters/github/run-agent.sh" cleanup || true
          rm -rf "$RUNNER_TEMP/kit"
