name: Publish release

# Builds the standalone win-x64 d365architect.exe and publishes it as a
# GitHub Release asset.
#
# Versioning (via MinVer, see the MinVer* properties in the .csproj):
#   - "vX.Y.Z" tag push: a real release. A maintainer tags a commit on main
#              and pushes the tag; MinVer reads that tag as the version.
#              The run fails if the tagged commit is not on main. Published
#              as a full (non-prerelease) GitHub Release. A push to main
#              without a tag publishes nothing.
#   - develop: each push is a pre-release. MinVer computes a semver
#              pre-release version from the commit height since the last
#              release tag (e.g. 1.2.4-alpha.0.7). Published as a GitHub
#              Release marked "Pre-release", tagged with that raw version
#              string (no "v" prefix, so it never matches the "v*" tag
#              trigger below or MinVer's own "v"-prefixed tag search).
on:
  push:
    branches: [develop]
    tags: ["v*"]
  # Lets a run be kicked off by hand (e.g. `gh workflow run publish-release.yml
  # --ref <branch-or-tag>`), for testing or to retry a failed publish without
  # a new commit. Run against a "v*" tag it takes the release path (with the
  # same on-main check); against any branch it takes the pre-release path.
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: D365 Architect/D365 Architect.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # MinVer needs full history to find the nearest version tag.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Read MinVer-computed version
        id: current_version
        run: |
          # -t:Build must be explicit: bare -getProperty (even under
          # `dotnet build`) skips target execution entirely, so MinVer's
          # own version-computing task never runs and this silently falls
          # back to the SDK's default "1.0.0" instead of the real value.
          version=$(dotnet build "$PROJECT" -c Release --no-restore -t:Build -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release tag (tag runs only)
        id: release_tag
        if: github.ref_type == 'tag'
        run: |
          tag="${{ github.ref_name }}"
          version="${{ steps.current_version.outputs.version }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z, got '$tag'."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$tag' points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
          if [ "v$version" != "$tag" ]; then
            echo "::error::MinVer computed '$version' for tag '$tag'. Check MinVerTagPrefix and that the tag is on this commit."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish (standalone win-x64)
        # PublishDir is overridden with forward slashes (rather than relying
        # on the profile's own backslash-separated path) so this stays
        # correct when the job runs on a non-Windows runner. No --no-restore
        # here: the earlier plain "dotnet restore" didn't pull win-x64
        # runtime packages, so publish needs to restore again itself once it
        # knows the RID (from the profile).
        run: >
          dotnet publish "$PROJECT" -c Release -p:PublishProfile=win-x64
          -p:PublishDir=bin/Release/net10.0/publish/win-x64/

      - name: Determine release metadata
        id: release
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ steps.release_tag.outputs.tag }}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            version="${{ steps.current_version.outputs.version }}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip publish output
        run: |
          asset="d365architect-${{ steps.release.outputs.version }}-win-x64.zip"
          (cd "D365 Architect/bin/Release/net10.0/publish/win-x64" && zip -r "$GITHUB_WORKSPACE/$asset" .)
          echo "asset=$asset" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          if [ "${{ steps.release.outputs.prerelease }}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "${{ steps.release.outputs.tag }}" \
            "$asset" \
            --title "${{ steps.release.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            "${prerelease_flag[@]}"
